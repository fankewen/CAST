services:
  api:
    build:
      context: ../..
      dockerfile: blender/remote/Dockerfile
    image: cast-deploy:local
    env_file: .env
    environment:
      CAST_HOST: 0.0.0.0
      CAST_PORT: "8080"
      CAST_STATE_DIR: /state
      CAST_ASSETS_DIR: /assets
    gpus: all
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./assets:/assets:ro
      - ./var:/state
    restart: unless-stopped
    shm_size: 2gb
  admin:
    image: cast-deploy:local
    env_file: .env
    environment:
      CAST_ADMIN_HOST: 0.0.0.0
      CAST_ADMIN_PORT: "8081"
      CAST_STATE_DIR: /state
      CAST_ASSETS_DIR: /assets
      CAST_ADMIN_STATE_DIR: /admin-local
      CAST_INTERNAL_API_URL: http://api:8080
    command: ["python", "-u", "admin/run_admin.py"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./assets:/assets:ro
      - ./var:/state
      - admin-local:/admin-local
    restart: unless-stopped
    depends_on: [api]
volumes:
  admin-local:
